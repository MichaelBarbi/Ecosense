{% load static %}

<style>

    .navbar-brand {
        color: #28a745; 
        font-weight: bold;
        font-size: 2.5em
    }

    .btn-success {
        --bs-btn-bg: #28a745;
    }

</style>

<nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container">
        
        <a class="navbar-brand" href="#">Ecosense</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">

            <ul class="navbar-nav me-auto">

                <!-- Left side links -->
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Catalog</a>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated and user.customer %}

                    <!-- Right-aligned dropdown for customer -->
                    <li class="nav-item dropdown ">

                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {{ user.username }}
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Sensors</a></li>
                            <li><a class="dropdown-item" href="#">Orders</a></li>
                            <li><a class="dropdown-item" href="#">Ticket</a></li>
                            <li><a class="dropdown-item" href="#">Calendar</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{% url 'logout' %}">Logout</a></li>
                        </ul>

                    </li>
                {% else %}

                    <!-- Right-aligned login/signup -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}"><button type="button" class="btn btn-outline-secondary" style="color: white; border-color: white">Sign In</button></a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}"><button type="button" class="btn btn-success">Sign Up</button></a>
                    </li>

                {% endif %}
            </ul>

        </div>

    </div>
</nav>
