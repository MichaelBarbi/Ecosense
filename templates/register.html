{% extends "base.html" %}

{% block title %}{{ title }}{% endblock title %}

{% block extra_css %}
{{ block.super }}

<style>

    #overlayCard {
        background: linear-gradient(to bottom right, #28a745, #212529);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-wrapper {
        background: white;
        padding: 40px 30px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        width: 350px;
        max-width: 90%;
    }

    .login-form h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #212529;
        font-family: "Tinos", serif;
        font-weight: 700;
        font-style: normal;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: flex;
        align-items: center;
        background: #f0f0f0;
        border-radius: 5px;
        padding: 10px;
    }

    .input-group .icon {
        margin-right: 10px;
        font-size: 1.2rem;
        color: #212529;
    }

    .input-group input {
        border: none;
        background: transparent;
        outline: none;
        flex: 1;
        font-size: 1rem;
        color: #212529;
    }

    label {
        width: 100%;
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        font-size: 0.9rem;
        color: #212529;
    }

    .login-button {
        background: #28a745;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.3s ease;
    }

    .login-button:hover {
        background: #218838;
    }


    .signup-text {
        text-align: center;
        margin-top: 30px;
        font-size: 0.85rem;
        color: #212529;
    }

    .signup-text a {
        color: #28a745;
        text-decoration: none;
    }

    .signup-text a:hover {
        text-decoration: underline;
    }

    #back button a {
        color: white;
        text-decoration: none
    }
</style>

{% endblock extra_css %}

{% block content %}
    <div id="overlayCard">
        <div class="login-wrapper">
            <form class="login-form">

                <h2>ECOSENSE</h2>

                <div class="input-group">
                    <label>
                        <input type="email" placeholder="Email" required />
                    </label>
                </div>

                <div class="input-group">
                    <label>
                        <input type="password" placeholder="Password" required />
                    </label>
                </div>

                <button type="submit" class="login-button">Sign Up</button>

                <p class="signup-text">Already have an account?<a href="/login/">Sign in now</a></p>

                <div id="back" class="col text-center">
                    <button type="button" class="btn btn-dark"><a href="{% url 'home' %}">Back</a></button>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
